<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6A1B9A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="วาดทาย">
  <meta name="description" content="วาดทาย — วาดรูปให้เพื่อนทาย ห้ามพิมพ์ ห้ามพูด!">
  <title>วาดทาย | Draw & Guess</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/common.css">
  <link rel="stylesheet" href="../../shared/components/lobby.css">
  <link rel="stylesheet" href="../../shared/components/onboarding.css">
  <link rel="stylesheet" href="../../shared/components/roomShare.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========== SCREEN: HOME ========== -->
  <div class="screen active" id="screen-home">
    <div class="home-container">
      <div class="home-icon">&#x1f3a8;</div>
      <h1 class="home-title">วาดทาย</h1>
      <p class="home-subtitle">วาดรูปให้เพื่อนทาย ห้ามพิมพ์ ห้ามพูด!</p>

      <div class="home-buttons">
        <button class="btn btn-primary" id="btnCreate">สร้างห้อง</button>
        <button class="btn btn-secondary" id="btnJoin">เข้าร่วมห้อง</button>
      </div>

      <a href="/" class="btn btn-ghost" style="margin-top: 16px;">&#x2190; กลับหน้าหลัก</a>
    </div>
  </div>

  <!-- ========== SCREEN: NICKNAME ========== -->
  <div class="screen" id="screen-nickname">
    <button class="home-back" id="btnBackHome">&#x2190; กลับ</button>
    <div class="nickname-container">
      <h2 style="margin-bottom: 20px; font-size: 20px;">เลือกตัวละคร</h2>
      <div class="avatar-picker" id="avatarPicker"></div>
      <input type="text" class="nickname-input" id="nicknameInput" placeholder="ชื่อของคุณ" maxlength="15">

      <div id="joinCodeGroup" style="display: none; margin-bottom: 16px;">
        <p style="font-size: 13px; color: var(--dg-text-secondary); margin-bottom: 8px;">รหัสห้อง</p>
        <input type="text" class="join-code-input" id="joinCodeInput" placeholder="ABCD" maxlength="4"
               style="text-transform: uppercase; text-align: center; font-size: 24px; letter-spacing: 8px;">
      </div>

      <button class="btn btn-primary" id="btnGo" style="width: 100%; margin-top: 12px;">เข้าสู่เกม</button>
    </div>
  </div>

  <!-- ========== SCREEN: LOBBY ========== -->
  <div class="screen" id="screen-lobby">
    <div class="lobby-container">
      <h2 class="lobby-title">ห้องรอ</h2>
      <div class="room-code-display" id="roomCodeDisplay">----</div>
      <p style="font-size: 12px; color: var(--dg-text-secondary); margin-top: 4px;">แชร์รหัสห้องให้เพื่อน</p>
      <button class="btn-share-room" id="btnShareRoom">📱 แชร์ห้อง / Share</button>

      <!-- Config (host only) -->
      <div class="config-panel" id="configPanel" style="display: none;">
        <div class="config-row">
          <label>จำนวนรอบ</label>
          <div class="config-stepper">
            <button class="config-btn" id="roundsMinus">-</button>
            <span class="config-value" id="roundsValue">2</span>
            <button class="config-btn" id="roundsPlus">+</button>
          </div>
        </div>
        <div class="config-row">
          <label>เวลาวาด (วินาที)</label>
          <div class="config-stepper">
            <button class="config-btn" id="timeMinus">-</button>
            <span class="config-value" id="timeValue">60</span>
            <button class="config-btn" id="timePlus">+</button>
          </div>
        </div>
        <!-- Sprint 13 — Issue #14: guess strictness selector -->
        <div class="config-row">
          <label>ความเข้มงวดในการทาย</label>
          <div class="config-strictness" role="radiogroup" aria-label="ความเข้มงวด">
            <button class="config-btn-strict" data-strictness="strict">เข้มงวด</button>
            <button class="config-btn-strict active" data-strictness="normal">ปกติ</button>
            <button class="config-btn-strict" data-strictness="lenient">ผ่อนปรน</button>
          </div>
        </div>
      </div>

      <div class="player-list" id="playerList"></div>

      <button class="btn btn-primary" id="btnStart" style="display: none; width: 100%; margin-top: 16px;">เริ่มเกม (3-8 คน)</button>
    </div>
  </div>

  <!-- ========== SCREEN: GAME (Drawing / Guessing) ========== -->
  <div class="screen" id="screen-game">
    <!-- Header: Round / Turn info + Timer -->
    <div class="game-header">
      <div class="game-info">
        <span id="roundInfo">รอบ 1/2</span>
        <span class="divider">|</span>
        <span id="drawerInfo">กำลังวาด: ...</span>
      </div>
      <div class="game-timer" id="gameTimer">60</div>
    </div>

    <!-- Word display (drawer only) / Hint (guessers) -->
    <div class="word-display" id="wordDisplay">
      <span id="wordText"></span>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-container" id="canvasContainer">
      <canvas id="drawCanvas"></canvas>
    </div>

    <!-- Drawing Tools (drawer only) -->
    <div class="tools-panel" id="toolsPanel" style="display: none;">
      <div class="color-palette" id="colorPalette"></div>
      <div class="tool-buttons">
        <button class="tool-btn active" id="toolPen" title="ปากกา">&#x270F;</button>
        <button class="tool-btn" id="toolEraser" title="ยางลบ">&#x1f9f9;</button>
        <button class="tool-btn" id="toolUndo" title="ย้อน">&#x21a9;</button>
        <button class="tool-btn" id="toolClear" title="ลบทั้งหมด">&#x1f5d1;</button>
      </div>
      <div class="size-buttons" id="sizeButtons">
        <button class="size-btn" data-size="2">&#x2022;</button>
        <button class="size-btn active" data-size="5">&#x25cf;</button>
        <button class="size-btn" data-size="10">&#x2b24;</button>
      </div>
    </div>

    <!-- Guess Area (guessers only) -->
    <div class="guess-area" id="guessArea" style="display: none;">
      <div class="guess-feed" id="guessFeed"></div>
      <div class="guess-input-row">
        <input type="text" class="guess-input" id="guessInput" placeholder="พิมพ์คำตอบ..." maxlength="50">
        <button class="btn btn-primary guess-submit" id="guessSubmit">ทาย</button>
      </div>
    </div>

    <!-- Scoreboard sidebar -->
    <div class="score-sidebar" id="scoreSidebar"></div>
  </div>

  <!-- ========== SCREEN: ROUND END ========== -->
  <div class="screen" id="screen-roundend">
    <div class="roundend-container">
      <h2>คำตอบคือ</h2>
      <div class="revealed-word" id="revealedWord"></div>
      <div class="round-results" id="roundResults"></div>
    </div>
  </div>

  <!-- ========== SCREEN: SCOREBOARD ========== -->
  <div class="screen" id="screen-scoreboard">
    <div class="scoreboard-container">
      <h2 id="scoreboardTitle">คะแนนรวม</h2>
      <div class="scoreboard-list" id="scoreboardList"></div>
    </div>
  </div>

  <!-- ========== SCREEN: GAME OVER ========== -->
  <div class="screen" id="screen-gameover">
    <div class="gameover-container">
      <div class="winner-crown">&#x1f451;</div>
      <h2 id="winnerName"></h2>
      <p class="winner-score" id="winnerScore"></p>
      <div class="final-scores" id="finalScores"></div>
      <button class="btn btn-primary" id="btnPlayAgain" style="margin-top: 20px; width: 100%;">เล่นอีกครั้ง</button>
      <a href="/" class="btn btn-ghost" style="margin-top: 8px;">กลับหน้าหลัก</a>
    </div>
  </div>

  <script src="https://unpkg.com/colyseus.js@0.15/dist/colyseus.js"></script>
  <script src="../../shared/components/lobby.js"></script>
  <script src="../../shared/components/onboarding.js"></script>
  <script src="../../shared/vendor/qrcode.min.js"></script>
  <script src="../../shared/components/roomShare.js"></script>
  <script src="game.js"></script>
</body>
</html>
