<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Party Games TH">
  <meta name="description" content="เกมปาร์ตี้ออนไลน์ เล่นกับเพื่อนได้ทุกที่ ไม่ต้องดาวน์โหลด!">
  <title>เกมปาร์ตี้ | Party Games TH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─── Platform Home Styles ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #1a1a2e;
      --bg-card: #16213e;
      --bg-card-hover: #1e2d50;
      --accent: #6C5CE7;
      --accent-light: #a29bfe;
      --text-primary: #ffffff;
      --text-secondary: #b0b0c8;
      --badge-coming-soon: #ffa502;
      --badge-active: #2ed573;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* ─── Header ─────────────────────────────────── */
    .platform-header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .platform-logo {
      font-size: 48px;
      margin-bottom: 8px;
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .platform-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-light), #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .platform-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ─── Game Grid ──────────────────────────────── */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px 16px;
      max-width: 420px;
      margin: 0 auto;
      flex: 1;
    }

    .game-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    .game-card:active {
      transform: scale(0.96);
    }

    .game-card:not(.coming-soon):hover,
    .game-card:not(.coming-soon):focus {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
    }

    .game-card.coming-soon {
      opacity: 0.7;
      cursor: default;
    }

    .game-card-icon {
      font-size: 40px;
      margin-bottom: 8px;
      display: block;
    }

    .game-card-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .game-card-players {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .game-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* ─── Badges ──────────────────────────────────── */
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .badge-active {
      background: var(--badge-active);
      color: #1a1a2e;
    }

    .badge-coming-soon {
      background: var(--badge-coming-soon);
      color: #1a1a2e;
    }

    /* ─── Coming Soon Toast ──────────────────────── */
    .toast-overlay {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-overlay.show {
      opacity: 1;
    }

    /* ─── Footer ──────────────────────────────────── */
    .platform-footer {
      text-align: center;
      padding: 16px 20px calc(16px + var(--safe-bottom));
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* ─── Loading State ──────────────────────────── */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--text-secondary);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state {
      text-align: center;
      padding: 60px 20px;
      color: #ff6b6b;
    }

    .error-state button {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      font-weight: 600;
    }

    /* ─── Responsive ─────────────────────────────── */
    @media (min-width: 480px) {
      .game-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 600px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="platform-header">
    <div class="platform-logo">🎮</div>
    <h1 class="platform-title">เกมปาร์ตี้</h1>
    <p class="platform-subtitle">เล่นกับเพื่อน ไม่ต้องดาวน์โหลด!</p>
  </header>

  <!-- Game Grid -->
  <main class="game-grid" id="gameGrid">
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <div>กำลังโหลดเกม...</div>
    </div>
  </main>

  <!-- Coming Soon Toast -->
  <div class="toast-overlay" id="comingSoonToast">เร็วๆ นี้!</div>

  <!-- Footer -->
  <footer class="platform-footer">
    Party Games TH v2.0
  </footer>

  <script>
    (function () {
      'use strict';

      const gameGrid = document.getElementById('gameGrid');
      const loadingState = document.getElementById('loadingState');
      const comingSoonToast = document.getElementById('comingSoonToast');
      let toastTimeout = null;

      /**
       * Fetch the game list from the server and render game cards.
       */
      async function loadGames() {
        try {
          const res = await fetch('/api/games');
          const data = await res.json();

          if (!data.success || !Array.isArray(data.games)) {
            throw new Error('Invalid response');
          }

          renderGames(data.games);
        } catch (err) {
          console.error('Failed to load games:', err);
          gameGrid.innerHTML = `
            <div class="error-state" style="grid-column: 1 / -1;">
              <div style="font-size: 48px; margin-bottom: 12px;">😵</div>
              <div>ไม่สามารถโหลดรายการเกมได้</div>
              <button onclick="location.reload()">ลองอีกครั้ง</button>
            </div>
          `;
        }
      }

      /**
       * Render game cards in the grid.
       */
      function renderGames(games) {
        gameGrid.innerHTML = '';

        games.forEach(function (game) {
          var card = document.createElement('div');
          card.className = 'game-card' + (game.comingSoon ? ' coming-soon' : '');
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.setAttribute('aria-label', game.displayNameTh);

          // Badge
          var badgeHtml = '';
          if (game.comingSoon) {
            badgeHtml = '<span class="badge badge-coming-soon">เร็วๆ นี้</span>';
          }

          card.innerHTML =
            badgeHtml +
            '<span class="game-card-icon">' + game.icon + '</span>' +
            '<div class="game-card-name">' + game.displayNameTh + '</div>' +
            '<div class="game-card-players">' + game.minPlayers + '-' + game.maxPlayers + ' คน</div>' +
            '<div class="game-card-desc">' + game.description + '</div>';

          card.addEventListener('click', function () {
            if (game.comingSoon) {
              showComingSoonToast(game.displayNameTh);
            } else {
              navigateToGame(game.id);
            }
          });

          // Keyboard accessibility
          card.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              card.click();
            }
          });

          gameGrid.appendChild(card);
        });
      }

      /**
       * Navigate to a game's page.
       */
      function navigateToGame(gameId) {
        // Map game IDs to their client paths
        var gamePaths = {
          'forbidden-word': '/games/forbidden-word/index.html',
          'word-link': '/games/word-link/index.html',
          'spy': '/games/spy/index.html',
          'werewolf': '/games/werewolf/index.html'
        };

        var path = gamePaths[gameId];
        if (path) {
          window.location.href = path;
        } else {
          showComingSoonToast('เกมนี้');
        }
      }

      /**
       * Show a "coming soon" toast notification.
       */
      function showComingSoonToast(gameName) {
        comingSoonToast.textContent = gameName + ' — เร็วๆ นี้!';
        comingSoonToast.classList.add('show');

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function () {
          comingSoonToast.classList.remove('show');
        }, 2000);
      }

      // Load games on page load
      loadGames();
    })();
  </script>
</body>
</html>
